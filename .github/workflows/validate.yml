name: Validate data without publishing
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validator and publication safety tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate approved manifest
        run: python tools/validate_event.py --root .
      - name: Validate proposed review draft
        run: python tools/validate_event.py --event drafts/UFC333_REVIEW_DRAFT.json
